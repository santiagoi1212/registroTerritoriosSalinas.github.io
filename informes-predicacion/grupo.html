<!doctype html>
<html lang="es">
<head>
<link rel="preconnect" href="https://script.google.com" crossorigin><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informes por grupo · Portal Salinas</title>
<!--
  Vista PÚBLICA (no pide iniciar sesión) del informe mensual por grupo:
  quiénes ya se registraron y quiénes faltan, más el resumen del grupo.
  Usa el mismo Apps Script que informes-predicacion/index.html
  (INFORMES_PREDICACION_API_URL, ?action=cache). Al pasar el mouse (o tocar,
  en el celular) sobre alguien que ya envió, muestra lo que informó ese mes
  (situación, participó, horas, cursos). A propósito NO muestra el estado de
  actividad (Activo/Irregular/Inactivo) ni el Estado del padrón (Anciano,
  Siervo, etc.): eso queda en la página con sesión.
  Link directo a un grupo: grupo.html?grupo=3
-->
<script src="../app-config.js"></script>
<!-- Solo para saber si quien mira es admin (botón "Reporte"); la página en
     sí sigue siendo pública. -->
<script src="../app-auth.js"></script>
<style>
  :root{
    --bg:#0b1220; --card:#111a2e; --card-2:#0f1728; --border:#22304a;
    --text:#e5e7eb; --muted:#94a3b8; --accent:#3b82f6;
    --good:#22c55e; --warn:#f59e0b; --crit:#ef4444;
    --publicador:#3987e5; --auxiliar:#d95926; --regular:#199e70; --especial:#a78bfa;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f7f9; --card:#ffffff; --card-2:#f8fafc; --border:#e2e8f0;
      --text:#0f172a; --muted:#64748b; --accent:#2563eb;
      --good:#16a34a; --warn:#d97706; --crit:#dc2626;
      --publicador:#2a78d6; --auxiliar:#eb6834; --regular:#1baf7a; --especial:#8b5cf6;
      color-scheme: light;
    }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap{ max-width:900px; margin:0 auto; padding:28px 16px 48px; }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--muted); margin:0 0 20px; font-size:14px; }

  .controles{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; }
  .tab{ border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px; padding:7px 14px; font-family:inherit; font-weight:600; font-size:14px; line-height:1; cursor:pointer; }
  .tab[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  select{ background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-family:inherit; font-size:14px; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
  .card h2{ font-size:17px; margin:0 0 12px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .card h2 .mes{ color:var(--muted); font-weight:500; font-size:14px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip{ background:var(--card-2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:13px; color:var(--muted); }
  .chip b{ display:block; font-size:20px; color:var(--text); }
  .chip.good b{ color:var(--good); } .chip.warn b{ color:var(--warn); } .chip.crit b{ color:var(--crit); }

  .barra{ height:10px; background:var(--card-2); border:1px solid var(--border); border-radius:999px; overflow:hidden; margin:4px 0 16px; }
  .barra > span{ display:block; height:100%; background:var(--good); }

  .seccion{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 8px; font-weight:700; }
  .nombres{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:6px; }
  .nombre{ background:var(--card-2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:14px; }
  .nombre.falta{ border-left:3px solid var(--warn); }
  .nombre.ok{ border-left:3px solid var(--good); }
  .todo-ok{ color:var(--good); font-weight:600; }

  .situaciones{ display:flex; flex-wrap:wrap; gap:8px; }
  .sit{ display:inline-flex; align-items:center; gap:6px; font-size:13px; background:var(--card-2); border:1px solid var(--border); border-radius:999px; padding:5px 10px; }
  .sit i{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  details summary{ cursor:pointer; color:var(--muted); font-size:14px; margin-top:12px; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th, td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  th{ color:var(--muted); font-weight:600; font-size:13px; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }

  .estado{ color:var(--muted); text-align:center; padding:40px 10px; }
  .spinner{ width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:g .8s linear infinite; margin:0 auto 10px; }
  @keyframes g{ to{ transform:rotate(360deg); } }
  .pie{ color:var(--muted); font-size:12.5px; margin-top:18px; }

  /* ---- Reporte (solo admin) ---- */
  .btn{ background:var(--accent); color:#fff; border:0; border-radius:10px; padding:8px 14px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.sec{ background:var(--card); color:var(--text); border:1px solid var(--border); }
  #btn-reporte{ margin-left:auto; }
  .rep-controles{ display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:14px; }
  .rep-controles label{ display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); }
  .rep-mes{ border-top:2px solid var(--border); padding-top:14px; margin-top:18px; }
  .rep-mes:first-child{ border-top:0; margin-top:0; padding-top:0; }
  .rep-mes h3{ margin:0 0 4px; font-size:18px; }
  .rep-resumen{ color:var(--muted); font-size:13.5px; margin:0 0 10px; }
  .rep-cat{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; font-weight:700; }
  .rep-cat i{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; }
  .rep-vacio{ color:var(--muted); font-size:13.5px; margin:0; }
  .rep-faltan p{ margin:4px 0; font-size:14px; }
  .rep-total td{ font-weight:700; }
  @media print{
    body{ background:#fff; color:#000; }
    .wrap > :not(#reporte), #reporte .rep-controles, #reporte h2 .acciones, .pop{ display:none !important; }
    #reporte{ border:0; padding:0; }
    .card, table, th, td{ color:#000; border-color:#bbb; background:#fff; }
    .rep-mes{ break-inside:auto; }
    .rep-mes + .rep-mes{ break-before:page; }
  }

  .nombre.ok{ cursor:pointer; text-align:left; font:inherit; font-size:14px; color:inherit; width:100%; }
  .nombre.ok:hover, .nombre.ok:focus-visible, .nombre.ok.activo{ border-color:var(--accent); outline:none; }
  .pop{ position:fixed; z-index:50; min-width:220px; max-width:min(300px, calc(100vw - 24px)); background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.35); font-size:14px; display:none; }
  .pop.show{ display:block; }
  .pop h3{ margin:0 0 2px; font-size:15px; }
  .pop .pop-mes{ color:var(--muted); font-size:12.5px; margin-bottom:8px; }
  .pop dl{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; }
  .pop dt{ color:var(--muted); }
  .pop dd{ margin:0; font-weight:600; font-variant-numeric:tabular-nums; }
  @media (max-width:520px){ .nombres{ grid-template-columns:1fr; } h1{ font-size:19px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Informe de predicación por grupo</h1>
  <p class="sub">Quiénes ya enviaron su informe del mes y quiénes faltan.</p>

  <div class="controles">
    <div class="tabs" id="tabs" role="group" aria-label="Grupo"></div>
    <select id="sel-mes" aria-label="Mes"></select>
    <button type="button" class="btn" id="btn-reporte" hidden>📄 Reporte</button>
  </div>

  <div class="card" id="reporte" hidden>
    <h2>Reporte de informes <span class="acciones"><button type="button" class="btn sec" id="rep-cerrar">Cerrar</button></span></h2>
    <div class="rep-controles">
      <label>Desde<select id="rep-desde"></select></label>
      <label>Hasta<select id="rep-hasta"></select></label>
      <label>Grupo<select id="rep-grupo"></select></label>
      <button type="button" class="btn" id="rep-generar">Generar</button>
      <button type="button" class="btn sec" id="rep-imprimir">Imprimir / PDF</button>
    </div>
    <div id="rep-salida"></div>
  </div>

  <div id="contenido"><div class="estado"><div class="spinner"></div>Cargando…</div></div>
  <p class="pie" id="pie"></p>
</div>
<div class="pop" id="pop" role="dialog" aria-live="polite"></div>

<script>
(function () {
  var API_URL = (window.APP_CONFIG && window.APP_CONFIG.INFORMES_PREDICACION_API_URL) || '';
  var CACHE_KEY = 'salinas_informes_grupo_v3';
  var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var SITUACIONES = [
    { k: 'Publicador', css: 'var(--publicador)' },
    { k: 'Precursor Auxiliar', css: 'var(--auxiliar)' },
    { k: 'Precursor Regular', css: 'var(--regular)' },
    { k: 'Precursor Especial', css: 'var(--especial)' }
  ];

  var datos = null;              // { roster:[{grupo,nombre}], rows:[{nombre,periodKey,situacion}], generatedAt }
  var grupoSel = null;           // número de grupo o 'todos'
  var mesSel = null;             // periodKey

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function etiquetaMes(pk) { return MESES[pk % 12] + ' ' + Math.floor(pk / 12); }

  // Solo lo necesario para esta vista (sin estados del padrón): así la copia
  // guardada en el navegador tampoco guarda más de lo que se muestra.
  function reducir(data) {
    return {
      generatedAt: data.generatedAt || null,
      roster: (data.roster || []).map(function (r) { return { grupo: Number(r.grupo), nombre: r.nombre }; }),
      rows: (data.rows || []).map(function (r) {
        return { nombre: r.nombre, periodKey: Number(r.periodKey), situacion: r.situacion || '',
          participo: r.participo, horas: r.horas, cursos: r.cursos };
      })
    };
  }

  function leerCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; }
  }
  function guardarCache(d) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
  }

  async function traer() {
    var ultimoError;
    for (var i = 0; i < 3; i++) {
      try {
        var res = await fetch(API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + 'action=cache&_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var json = await res.json();
        if (json.error) throw new Error(json.error);
        return reducir(json);
      } catch (e) {
        ultimoError = e;
        await new Promise(function (r) { setTimeout(r, 1200); });
      }
    }
    throw ultimoError;
  }

  function grupos() {
    var set = {};
    datos.roster.forEach(function (r) { if (!isNaN(r.grupo)) set[r.grupo] = true; });
    return Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
  }
  function mesesConDatos() {
    var set = {};
    datos.rows.forEach(function (r) { if (!isNaN(r.periodKey)) set[r.periodKey] = true; });
    return Object.keys(set).map(Number).sort(function (a, b) { return b - a; });
  }
  // Para el selector: los meses con datos + todos los siguientes hasta
  // diciembre del año en curso (así se puede mirar, por ejemplo, si ya
  // empezaron a llegar los informes del mes que está corriendo).
  function meses() {
    var conDatos = mesesConDatos();
    var hoy = new Date();
    var finDeAnio = hoy.getFullYear() * 12 + 11;
    var desde = conDatos.length ? conDatos[0] + 1 : hoy.getFullYear() * 12 + hoy.getMonth();
    var todos = conDatos.slice();
    for (var pk = desde; pk <= finDeAnio; pk++) todos.push(pk);
    return todos.sort(function (a, b) { return b - a; });
  }

  // Integrantes del grupo y quiénes informaron ese mes.
  function vistaGrupo(g, pk) {
    var integrantes = datos.roster.filter(function (r) { return r.grupo === g; })
      .map(function (r) { return r.nombre; })
      .sort(function (a, b) { return a.localeCompare(b, 'es'); });
    var informe = {};
    datos.rows.forEach(function (r) { if (r.periodKey === pk) informe[r.nombre] = r; });
    var registrados = [], faltan = [], porSituacion = {};
    integrantes.forEach(function (n) {
      var r = informe[n];
      if (r) {
        registrados.push(n);
        porSituacion[r.situacion] = (porSituacion[r.situacion] || 0) + 1;
      } else {
        faltan.push(n);
      }
    });
    return { grupo: g, integrantes: integrantes, registrados: registrados, faltan: faltan, porSituacion: porSituacion };
  }

  function tarjetaGrupo(v) {
    var total = v.integrantes.length;
    var pct = total ? Math.round(v.registrados.length / total * 100) : 0;
    var clsFaltan = v.faltan.length === 0 ? 'good' : (v.faltan.length <= 2 ? 'warn' : 'crit');
    var sinInformes = v.registrados.length === 0;
    var faltanHtml = v.faltan.length
      ? '<div class="nombres">' + v.faltan.map(function (n) { return '<div class="nombre falta">' + esc(n) + '</div>'; }).join('') + '</div>'
      : '<p class="todo-ok">✅ Todos los del grupo ya enviaron su informe.</p>';
    var sits = SITUACIONES.filter(function (s) { return v.porSituacion[s.k]; })
      .map(function (s) { return '<span class="sit"><i style="background:' + s.css + '"></i>' + esc(s.k) + ': <b>' + v.porSituacion[s.k] + '</b></span>'; }).join('');
    return '<div class="card">' +
      '<h2>Grupo ' + v.grupo + ' <span class="mes">' + esc(etiquetaMes(mesSel)) + '</span></h2>' +
      '<div class="chips">' +
        '<div class="chip"><b>' + total + '</b>integrantes</div>' +
        '<div class="chip good"><b>' + v.registrados.length + '</b>ya enviaron</div>' +
        '<div class="chip ' + clsFaltan + '"><b>' + v.faltan.length + '</b>faltan</div>' +
      '</div>' +
      '<div class="barra" title="' + pct + '% enviaron"><span style="width:' + pct + '%"></span></div>' +
      (sinInformes ? '<p class="sub" style="margin:0 0 6px">Todavía no llegó ningún informe de este grupo para este mes.</p>' : '') +
      '<div class="seccion">Faltan registrarse</div>' + faltanHtml +
      (sits ? '<div class="seccion">Cómo informaron</div><div class="situaciones">' + sits + '</div>' : '') +
      (v.registrados.length
        ? '<details><summary>Ya enviaron (' + v.registrados.length + ')</summary><div class="nombres" style="margin-top:8px">' +
            v.registrados.map(function (n) { return '<button type="button" class="nombre ok" data-persona="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div></details>'
        : '') +
      '</div>';
  }

  function tablaResumen(vistas) {
    var filas = vistas.map(function (v) {
      var total = v.integrantes.length, pct = total ? Math.round(v.registrados.length / total * 100) : 0;
      return '<tr><td><a href="?grupo=' + v.grupo + '" data-grupo="' + v.grupo + '" style="color:var(--accent)">Grupo ' + v.grupo + '</a></td>' +
        '<td class="num">' + total + '</td><td class="num">' + v.registrados.length + '</td><td class="num">' + v.faltan.length + '</td><td class="num">' + pct + '%</td></tr>';
    }).join('');
    var tot = vistas.reduce(function (a, v) { a.t += v.integrantes.length; a.r += v.registrados.length; a.f += v.faltan.length; return a; }, { t: 0, r: 0, f: 0 });
    return '<div class="card"><h2>Resumen de todos los grupos <span class="mes">' + esc(etiquetaMes(mesSel)) + '</span></h2>' +
      '<table><thead><tr><th>Grupo</th><th class="num">Integrantes</th><th class="num">Enviaron</th><th class="num">Faltan</th><th class="num">%</th></tr></thead>' +
      '<tbody>' + filas + '<tr><td><b>Total</b></td><td class="num"><b>' + tot.t + '</b></td><td class="num"><b>' + tot.r + '</b></td><td class="num"><b>' + tot.f + '</b></td><td class="num"><b>' +
      (tot.t ? Math.round(tot.r / tot.t * 100) : 0) + '%</b></td></tr></tbody></table></div>';
  }

  function pintar() {
    cerrarPop();
    var gs = grupos(), ms = meses();
    if (!gs.length || !ms.length) {
      document.getElementById('contenido').innerHTML = '<div class="estado">Todavía no hay datos para mostrar.</div>';
      return;
    }
    // Por defecto: el último mes que ya tiene informes (en general, el anterior).
    if (mesSel == null || ms.indexOf(mesSel) === -1) mesSel = mesesConDatos()[0] || ms[ms.length - 1];
    if (grupoSel !== 'todos' && gs.indexOf(grupoSel) === -1) grupoSel = 'todos';

    document.getElementById('tabs').innerHTML =
      '<button class="tab" data-grupo="todos" aria-pressed="' + (grupoSel === 'todos') + '">Todos</button>' +
      gs.map(function (g) { return '<button class="tab" data-grupo="' + g + '" aria-pressed="' + (grupoSel === g) + '">Grupo ' + g + '</button>'; }).join('');
    var sel = document.getElementById('sel-mes');
    sel.innerHTML = ms.map(function (pk) { return '<option value="' + pk + '"' + (pk === mesSel ? ' selected' : '') + '>' + etiquetaMes(pk) + '</option>'; }).join('');

    var html;
    if (grupoSel === 'todos') {
      var vistas = gs.map(function (g) { return vistaGrupo(g, mesSel); });
      html = tablaResumen(vistas) + vistas.map(tarjetaGrupo).join('');
    } else {
      html = tarjetaGrupo(vistaGrupo(grupoSel, mesSel));
    }
    document.getElementById('contenido').innerHTML = html;

    if (datos.generatedAt) {
      var d = new Date(datos.generatedAt);
      document.getElementById('pie').textContent = 'Datos actualizados al ' + d.toLocaleDateString('es-UY') + ' ' +
        d.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }) + ' (se actualizan solos cuando llegan informes nuevos)';
    }
  }

  // ---- Mini modal con lo que informó cada persona ----
  var pop = document.getElementById('pop');
  var popDe = null; // botón que lo abrió
  var ultimoPuntero = 'mouse'; // 'mouse' | 'touch' | 'pen' (del último pointerdown/pointerover)

  function informeDe(nombre) {
    for (var i = 0; i < datos.rows.length; i++) {
      var r = datos.rows[i];
      if (r.nombre === nombre && r.periodKey === mesSel) return r;
    }
    return null;
  }
  function valor(v) { return v === null || v === undefined || v === '' ? '—' : esc(v); }

  function abrirPop(btn) {
    var nombre = btn.getAttribute('data-persona');
    var r = informeDe(nombre);
    if (!r) return;
    var participo = r.participo === true ? 'Sí' : (r.participo === false ? 'No' : '—');
    pop.innerHTML = '<h3>' + esc(nombre) + '</h3><div class="pop-mes">' + esc(etiquetaMes(mesSel)) + '</div>' +
      '<dl><dt>Situación</dt><dd>' + valor(r.situacion) + '</dd>' +
      '<dt>Participó</dt><dd>' + participo + '</dd>' +
      '<dt>Horas</dt><dd>' + valor(r.horas) + '</dd>' +
      '<dt>Cursos bíblicos</dt><dd>' + valor(r.cursos) + '</dd></dl>';
    if (popDe) popDe.classList.remove('activo');
    popDe = btn;
    btn.classList.add('activo');
    pop.classList.add('show');
    // Debajo del nombre (o arriba si no entra), sin salirse de la pantalla.
    var b = btn.getBoundingClientRect(), p = pop.getBoundingClientRect();
    var top = b.bottom + 6;
    if (top + p.height > window.innerHeight - 8) top = Math.max(8, b.top - p.height - 6);
    var left = Math.min(Math.max(8, b.left), window.innerWidth - p.width - 8);
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
  }
  function cerrarPop() {
    pop.classList.remove('show');
    if (popDe) popDe.classList.remove('activo');
    popDe = null;
  }

  // Con mouse: se abre al pasar por arriba y se cierra al salir.
  document.addEventListener('pointerover', function (e) {
    ultimoPuntero = e.pointerType;
    if (e.pointerType !== 'mouse') return;
    var btn = e.target.closest('.nombre.ok');
    if (btn && btn !== popDe) abrirPop(btn);
  });
  document.addEventListener('pointerout', function (e) {
    if (e.pointerType !== 'mouse' || !popDe) return;
    var btn = e.target.closest('.nombre.ok');
    if (btn && !btn.contains(e.relatedTarget)) cerrarPop();
  });
  document.addEventListener('pointerdown', function (e) { ultimoPuntero = e.pointerType; });
  // Tocar (celular) o click: abre/cierra. Tocar en otro lado lo cierra.
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.nombre.ok');
    if (btn) { if (popDe === btn && ultimoPuntero !== 'mouse') cerrarPop(); else abrirPop(btn); return; }
    if (!pop.contains(e.target)) cerrarPop();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarPop(); });
  window.addEventListener('scroll', cerrarPop, { passive: true });
  window.addEventListener('resize', cerrarPop);

  // ================== Reporte (solo admin logueado) ==================
  // Por cada mes del rango: quiénes informaron (aunque hayan puesto que no
  // participaron), separados en precursores regulares, auxiliares,
  // publicadores (y especiales si hubo), quiénes informaron que no
  // participaron, y quiénes faltaron por grupo. Al final, promedios por mes.
  var CATS_REPORTE = [
    { k: 'Precursor Regular', titulo: 'Precursores regulares', css: 'var(--regular)', horas: true },
    { k: 'Precursor Especial', titulo: 'Precursores especiales', css: 'var(--especial)', horas: true },
    { k: 'Precursor Auxiliar', titulo: 'Precursores auxiliares', css: 'var(--auxiliar)', horas: true },
    { k: 'Publicador', titulo: 'Publicadores', css: 'var(--publicador)', horas: false },
    { k: 'Otro', titulo: 'Sin situación', css: 'var(--muted)', horas: false }
  ];

  function esAdmin() {
    return !!(window.AuthApp && AuthApp.isLogged() && String(AuthApp.getRole() || '').toLowerCase() === 'admin');
  }
  function actualizarBotonReporte() {
    var admin = esAdmin();
    document.getElementById('btn-reporte').hidden = !admin;
    if (!admin) document.getElementById('reporte').hidden = true;
  }

  function enCat(r, c) {
    var sit = r.situacion || 'Otro';
    if (['Precursor Regular', 'Precursor Especial', 'Precursor Auxiliar', 'Publicador'].indexOf(sit) === -1) sit = 'Otro';
    return sit === c.k;
  }
  function num(v) { return typeof v === 'number' && !isNaN(v) ? v : null; }
  function fmt(n) { return (Math.round(n * 10) / 10).toLocaleString('es-UY'); }

  function abrirReporte() {
    if (!datos) return; // todavía cargando
    var conDatos = mesesConDatos(); // de más nuevo a más viejo
    var opciones = conDatos.map(function (pk) { return '<option value="' + pk + '">' + etiquetaMes(pk) + '</option>'; }).join('');
    var desde = document.getElementById('rep-desde'), hasta = document.getElementById('rep-hasta');
    desde.innerHTML = opciones; hasta.innerHTML = opciones;
    // Por defecto: los 6 meses con datos que terminan en el mes elegido arriba.
    var fin = conDatos.indexOf(mesSel) >= 0 ? mesSel : conDatos[0];
    hasta.value = fin;
    desde.value = conDatos[Math.min(conDatos.indexOf(fin) + 5, conDatos.length - 1)];
    document.getElementById('rep-grupo').innerHTML = '<option value="todos">Todos</option>' +
      grupos().map(function (g) { return '<option value="' + g + '">Grupo ' + g + '</option>'; }).join('');
    document.getElementById('rep-grupo').value = String(grupoSel);
    document.getElementById('reporte').hidden = false;
    generarReporte();
    document.getElementById('reporte').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function tablaPersonas(lista, conHoras) {
    return '<table><thead><tr><th>Nombre</th><th>Grupo</th>' + (conHoras ? '<th class="num">Horas</th>' : '') + '<th class="num">Cursos</th></tr></thead><tbody>' +
      lista.map(function (x) {
        return '<tr><td>' + esc(x.nombre) + '</td><td>' + x.grupo + '</td>' +
          (conHoras ? '<td class="num">' + (num(x.r.horas) == null ? '—' : x.r.horas) + '</td>' : '') +
          '<td class="num">' + (num(x.r.cursos) == null ? '—' : x.r.cursos) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function generarReporte() {
    var d = Number(document.getElementById('rep-desde').value), h = Number(document.getElementById('rep-hasta').value);
    if (d > h) { var t = d; d = h; h = t; }
    var gSel = document.getElementById('rep-grupo').value;
    var gs = gSel === 'todos' ? grupos() : [Number(gSel)];
    var meses = mesesConDatos().filter(function (pk) { return pk >= d && pk <= h; }).sort(function (a, b) { return a - b; });

    var acum = { meses: 0, integrantes: 0, informaron: 0, noParticiparon: 0, faltaron: 0, cursos: 0, cat: {} };
    CATS_REPORTE.forEach(function (c, i) { acum.cat[i] = { personas: 0, horas: 0, conHoras: 0 }; });

    var html = meses.map(function (pk) {
      var informaron = [], faltan = {}, integrantes = 0;
      gs.forEach(function (g) {
        var v = vistaGrupo(g, pk);
        integrantes += v.integrantes.length;
        faltan[g] = v.faltan;
        v.registrados.forEach(function (n) {
          var r = datos.rows.filter(function (x) { return x.nombre === n && x.periodKey === pk; })[0];
          if (r) informaron.push({ nombre: n, grupo: g, r: r });
        });
      });
      informaron.sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); });
      var noPart = informaron.filter(function (x) { return x.r.participo === false; });
      var participaron = informaron.filter(function (x) { return x.r.participo !== false; });
      var totalFaltan = gs.reduce(function (a, g) { return a + faltan[g].length; }, 0);
      var cursosMes = informaron.reduce(function (a, x) { return a + (num(x.r.cursos) || 0); }, 0);

      acum.meses++; acum.integrantes += integrantes; acum.informaron += informaron.length;
      acum.noParticiparon += noPart.length; acum.faltaron += totalFaltan; acum.cursos += cursosMes;

      var cats = CATS_REPORTE.map(function (c, i) {
        var lista = participaron.filter(function (x) { return enCat(x.r, c); });
        acum.cat[i].personas += lista.length;
        lista.forEach(function (x) { if (num(x.r.horas) != null) { acum.cat[i].horas += x.r.horas; acum.cat[i].conHoras++; } });
        // Auxiliares "sin especificar", especiales y "sin situación": solo si hay.
        if (!lista.length && (c.k === 'Precursor Especial' || c.k === 'Otro')) return '';
        return '<div class="rep-cat"><i style="background:' + c.css + '"></i>' + esc(c.titulo) + ' (' + lista.length + ')</div>' +
          (lista.length ? tablaPersonas(lista, c.horas) : '<p class="rep-vacio">Nadie.</p>');
      }).join('');

      var noPartHtml = '<div class="rep-cat">Informaron que no participaron (' + noPart.length + ')</div>' +
        (noPart.length
          ? '<table><thead><tr><th>Nombre</th><th>Grupo</th><th>Situación</th></tr></thead><tbody>' +
            noPart.map(function (x) { return '<tr><td>' + esc(x.nombre) + '</td><td>' + x.grupo + '</td><td>' + esc(x.r.situacion || '—') + '</td></tr>'; }).join('') +
            '</tbody></table>'
          : '<p class="rep-vacio">Nadie.</p>');

      var faltanHtml = '<div class="rep-cat">Faltaron registrar (' + totalFaltan + ')</div><div class="rep-faltan">' +
        gs.map(function (g) {
          return '<p><b>Grupo ' + g + ' (' + faltan[g].length + '):</b> ' + (faltan[g].length ? faltan[g].map(esc).join(', ') : '✅ ninguno') + '</p>';
        }).join('') + '</div>';

      var pct = integrantes ? Math.round(informaron.length / integrantes * 100) : 0;
      return '<section class="rep-mes"><h3>' + esc(etiquetaMes(pk)) + '</h3>' +
        '<p class="rep-resumen">Informaron <b>' + informaron.length + '</b> de ' + integrantes + ' (' + pct + '%) · ' +
        'no participaron ' + noPart.length + ' · faltaron ' + totalFaltan + ' · cursos bíblicos ' + cursosMes + '</p>' +
        cats + noPartHtml + faltanHtml + '</section>';
    }).join('');

    if (!meses.length) {
      document.getElementById('rep-salida').innerHTML = '<p class="rep-vacio">No hay informes en ese rango.</p>';
      return;
    }

    // Promedios por mes del período.
    var m = acum.meses;
    var filas = [
      ['Informaron', acum.informaron / m, acum.integrantes ? fmt(acum.informaron / acum.integrantes * 100) + '% de los integrantes' : ''],
      ['Informaron que no participaron', acum.noParticiparon / m, ''],
      ['Faltaron registrar', acum.faltaron / m, '']
    ];
    CATS_REPORTE.forEach(function (c, i) {
      var a = acum.cat[i];
      if (!a.personas && (c.k === 'Precursor Especial' || c.k === 'Otro')) return;
      filas.push([c.titulo, a.personas / m, c.horas && a.conHoras ? 'promedio ' + fmt(a.horas / a.conHoras) + ' horas por persona' : '']);
    });
    filas.push(['Cursos bíblicos', acum.cursos / m, '']);
    var promedios = '<section class="rep-mes"><h3>Promedios por mes</h3>' +
      '<p class="rep-resumen">' + esc(etiquetaMes(meses[0])) + (m > 1 ? ' a ' + esc(etiquetaMes(meses[m - 1])) : '') + ' · ' + m + ' mes' + (m > 1 ? 'es' : '') +
      (gSel === 'todos' ? ' · todos los grupos' : ' · grupo ' + esc(gSel)) + '</p>' +
      '<table><thead><tr><th></th><th class="num">Promedio por mes</th><th></th></tr></thead><tbody>' +
      filas.map(function (f) { return '<tr><td>' + esc(f[0]) + '</td><td class="num">' + fmt(f[1]) + '</td><td>' + esc(f[2]) + '</td></tr>'; }).join('') +
      '</tbody></table>' +
      '<p class="pie">Quiénes faltaron se calcula con los integrantes actuales de cada grupo.</p></section>';

    document.getElementById('rep-salida').innerHTML = html + promedios;
  }

  document.getElementById('btn-reporte').addEventListener('click', abrirReporte);
  document.getElementById('rep-generar').addEventListener('click', generarReporte);
  document.getElementById('rep-imprimir').addEventListener('click', function () { window.print(); });
  document.getElementById('rep-cerrar').addEventListener('click', function () { document.getElementById('reporte').hidden = true; });

  function elegirGrupo(g) {
    grupoSel = g === 'todos' ? 'todos' : Number(g);
    try { history.replaceState(null, '', grupoSel === 'todos' ? location.pathname : '?grupo=' + grupoSel); } catch (e) {}
    pintar();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-grupo]');
    if (!b) return;
    e.preventDefault();
    elegirGrupo(b.getAttribute('data-grupo'));
  });
  document.getElementById('sel-mes').addEventListener('change', function (e) {
    mesSel = Number(e.target.value);
    pintar();
  });

  if (window.AuthApp) {
    AuthApp.onChange(actualizarBotonReporte);
    AuthApp.restore();
  }

  (async function iniciar() {
    var param = new URLSearchParams(location.search).get('grupo');
    grupoSel = param && !isNaN(Number(param)) ? Number(param) : 'todos';

    if (!API_URL) {
      document.getElementById('contenido').innerHTML = '<div class="estado">Falta configurar INFORMES_PREDICACION_API_URL en app-config.js.</div>';
      return;
    }
    // Lo guardado se muestra al instante y se actualiza de fondo.
    var guardado = leerCache();
    if (guardado && guardado.roster) { datos = guardado; pintar(); }
    try {
      datos = await traer();
      guardarCache(datos);
      pintar();
    } catch (err) {
      console.error(err);
      if (!datos) {
        document.getElementById('contenido').innerHTML = '<div class="estado">No se pudieron cargar los datos. Probá de nuevo en un rato.</div>';
      }
    }
  })();
})();
</script>
