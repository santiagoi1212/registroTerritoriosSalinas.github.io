<style>
  /* ===== Desktop login styling & global form fixes ===== */
  /* Backdrop */
  #login-overlay{
    position: fixed;
    inset: 0;
    z-index: 4000;
    background: rgba(0,0,0,.55);
    display: none; /* toggled via JS */
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(1.5px);
  }
  /* Modal container */
  #login-modal{
    background: #0f172a;           /* slate-900 */
    color: #e5e7eb;                /* gray-200 */
    width: 100%;
    max-width: 480px;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.06);
  }
  /* Header / Body */
  #login-modal header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
  }
  #login-modal header h3{
    margin:0; font: 600 16px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
    letter-spacing: .2px;
  }
  #login-modal .modal-body{
    padding: 16px;
    display: grid;
    gap: 10px;
  }
  #login-modal .form-field{ display:grid; gap:6px; }
  #login-modal .form-label{ font-size: 13px; color: #cbd5e1; } /* slate-300 */
  #login-modal .form-input{
    width:100%;
    border: 1px solid #334155;     /* slate-700 */
    background: #0b1220;           /* deep slate */
    color: #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
  }
  #login-modal .form-input:focus{
    border-color: #60a5fa;         /* blue-400 */
    box-shadow: 0 0 0 3px rgba(96,165,250,.2);
  }
  #login-modal .form-actions{
    display:flex; gap:8px; justify-content:flex-end; margin-top:8px;
  }
  #login-modal .btn-primary{
    background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer;
  }
  #login-modal .btn-cancel{
    background:#1f2937; color:#e5e7eb; border:1px solid #334155; border-radius:10px; padding:10px 14px; cursor:pointer;
  }
  #login-modal .btn-primary:hover{ filter:brightness(1.06); }
  #login-modal .btn-cancel:hover{ filter:brightness(1.05); }

  /* Close button (if exists) */
  #login-modal .modal-close-btn{
    border:none; background:transparent; color:#94a3b8;
    font-size:18px; cursor:pointer; line-height:1;
  }
  #login-modal .modal-close-btn:hover{ color:#e2e8f0; }

  /* Leaflet controls sit below auth bar & modal */
  .leaflet-top, .leaflet-bottom{ z-index: 2000; }
  /* Floating refs button must be above Leaflet controls but below modal */
  .refs-toggle{ z-index: 2500; }

  /* ---- General form tidy for the registro modal to avoid clashing ---- */
  .modal-card input, .modal-card select, .modal-card textarea,

  <script>
    // ===== Helpers de ID =====
    // canonId: normaliza espacios alrededor de | y - pero conserva el ID completo
    function canonId(x) {
      return String(x ?? '')
        .trim()
        .replace(/\s*\|\s*/g, '|')
        .replace(/\s*-\s*/g, '-')
        .replace(/\s+/g, ' ');
    }

    // idKey: la key del Map ES el ID canónico completo (ej: "1007|142", "304-A")
    // Debe ser IDÉNTICA a la función canonId_ del backend (Apps Script)
    function idKey(x) {
      return canonId(x);
    }

    // Exponer globalmente (usado por repintarTerritorio y otros)
    window.idKey = idKey;
    window.normalizarId = idKey; // alias para compatibilidad
    // ===== Centroide por área (definir ANTES de usar) =====
    function centroidArea(coords) {
      // coords: [[lat,lng], ...]
      if (!Array.isArray(coords) || coords.length < 3) return null;
      // Convertimos a (x=lng, y=lat) para fórmula planar
      const pts = coords.map(c => [c[1], c[0]]);
      const n = pts.length;
      let area = 0, cx = 0, cy = 0;
      for (let i=0; i<n; i++) {
        const [x0,y0] = pts[i];
        const [x1,y1] = pts[(i+1)%n];
        const a = x0*y1 - x1*y0;
        area += a;
        cx += (x0 + x1) * a;
        cy += (y0 + y1) * a;
      }
      area *= 0.5;
      if (Math.abs(area) < 1e-12) return null;
      cx /= (6*area); cy /= (6*area);
      return [cy, cx]; // [lat,lng]
    }

    // ===== Vistas =====
    const centrado = [-34.77621131806037, -55.848931306524335];
    const centrosPorVista = {
      0: [-34.81, -55.93],
1: [-34.81336542548195, -55.94933026500102],
      2: [-34.82008935931963, -55.93356006777914],
      3: [-34.81338539561594, -55.932902226529094],
      4: [-34.81235461487246, -55.920060714757625],
      5: [-34.80399990239286, -55.916780479198835],
      6: [-34.80905521388421, -55.916027280722815],
      7: [-34.80517799529366, -55.90668192039635],
    };
    const territoriosPorVista = {
      1: [1,2,3],
      2: [4,6,8],
      3: [5,7,9],
      4: [10,11,12],
      5: [13,14,15],
      6: [13,14,15,10,11,12],
      7: [16,17,18,19,20,21,22],
    };
    function getVistaFromURL() {
      const p = new URLSearchParams(location.search);
      const n = parseInt(p.get('vista'), 10);
      return (n >= 0 && n <= 7) ? n : 1;
    }
    function toNumeroTerritorio(t) {
      const s = window.idKey ? window.idKey(t) : String(t ?? "").trim();
      const n = parseInt(s, 10);
      return Number.isFinite(n) ? n : null;
    }
    function centroide(coords) {
      // centroide "spherical" aproximado (fallback)
      let x=0, y=0, z=0, n=coords.length;
      for (const c of coords) {
        const lat = c[0] * Math.PI/180;
        const lon = c[1] * Math.PI/180;
        x += Math.cos(lat) * Math.cos(lon);
        y += Math.cos(lat) * Math.sin(lon);
        z += Math.sin(lat);
      }
      x/=n; y/=n; z/=n;
      const lon = Math.atan2(y, x);
      const hyp = Math.sqrt(x*x + y*y);
      const lat = Math.atan2(z, hyp);
      return [lat*180/Math.PI, lon*180/Math.PI];
    }

    // ===== Fuente de datos (JSON desde Apps Script, sin CSV) =====
// Apps Script redirige (302) y la URL final pierde los query params cuando se usa fetch().
// Por eso usamos JSONP como método principal: el parámetro "callback" sobrevive la redirección
// porque va embebido en la URL del <script>, no en headers.
async function cargarDatosDesdeBackend() {
  const base = (typeof WEBHOOK_URL === 'string' && WEBHOOK_URL) ? WEBHOOK_URL : '';
  if (!base) return [];

  // La URL base ya tiene la ruta del script; añadimos read=stats_rt
  const url = base + (base.includes('?') ? '&' : '?') + 'read=stats_rt';

  // 1) JSONP primero (sobrevive redirecciones de Apps Script)
  try {
    const items = await cargarDatosJSONP(url);
    if (Array.isArray(items) && items.length > 0) return items;
  } catch(_){}

  // 2) Fallback: fetch directo (funciona si se despliega sin redirección)
  try{
    const r = await fetch(url, { cache: 'no-store', headers: { 'Accept': 'application/json' } });
    if (r.ok) {
      const data = await r.json();
      return Array.isArray(data.items) ? data.items : [];
    }
  }catch(_){}

  return [];
}

function cargarDatosJSONP(urlBase) {
  return new Promise((resolve) => {
    const cb = '__cbStats_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');

    const cleanup = () => {
      try{ delete window[cb]; }catch(_){ window[cb]=undefined; }
      if (s && s.parentNode) s.parentNode.removeChild(s);
    };

    window[cb] = (payload) => {
      cleanup();
      try{
        const items = (payload && Array.isArray(payload.items)) ? payload.items : [];
        resolve(items);
      }catch(_){
        resolve([]);
      }
    };

    const sep = urlBase.includes('?') ? '&' : '?';
    s.src = urlBase + sep + 'callback=' + encodeURIComponent(cb);
    s.async = true;
    s.onerror = () => { cleanup(); resolve([]); };
    document.head.appendChild(s);
  });
}

async function enviarAlSheet(rec) {
  if (!WEBHOOK_URL) {
    console.log("Registro simulado:", rec);
    return { ok: true, simulated: true, territorio: String(rec.id || rec.territorio || ''), cantidad: null };
  }

  const payloadStr = JSON.stringify(rec);

  // helper: JSONP
  function fetchJsonp(url, cbParam = "callback", timeoutMs = 12000) {
    return new Promise((resolve, reject) => {
      const cbName = "cb_" + Math.random().toString(36).slice(2);
      const sep = url.includes("?") ? "&" : "?";
      const full = url + sep + new URLSearchParams({ [cbParam]: cbName });

      let done = false;
      const t = setTimeout(() => {
        if (done) return;
        done = true;
        try { delete window[cbName]; } catch (_) {}
        script.remove();
        reject(new Error("JSONP timeout"));
      }, timeoutMs);

      window[cbName] = (data) => {
        if (done) return;
        done = true;
        clearTimeout(t);
        try { delete window[cbName]; } catch (_) {}
        script.remove();
        resolve(data);
      };

      const script = document.createElement("script");
      script.src = full;
      script.onerror = () => {
        if (done) return;
        done = true;
        clearTimeout(t);
        try { delete window[cbName]; } catch (_) {}
        script.remove();
        reject(new Error("JSONP error"));
      };
      document.head.appendChild(script);
    });
  }

  try {
    // 1) POST (preferido)
    const body = new URLSearchParams({ payload: payloadStr });
    const r = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=utf-8" },
      body
    });

    // Si el navegador bloqueó CORS, r.ok puede ser false o incluso lanzar excepción arriba.
    // Pero si llegó y es OK, leemos JSON:
    if (r.ok) {
      const data = await r.json().catch(() => ({}));
      // data esperado: { ok:true, territorio, cantidad }
      return { ...data, via: "POST" };
    }

    // 2) GET normal (intentamos leer JSON)
    const urlGet = WEBHOOK_URL + "?" + new URLSearchParams({ payload: payloadStr });
    const r2 = await fetch(urlGet, { method: "GET" });
    if (r2.ok) {
      const data2 = await r2.json().catch(() => ({}));
      return { ...data2, via: "GET" };
    }

    // 3) JSONP final (si CORS molesta)
    const urlJsonp = WEBHOOK_URL + "?" + new URLSearchParams({ payload: payloadStr });
    const data3 = await fetchJsonp(urlJsonp);
    return { ...data3, via: "JSONP" };

  } catch (e) {
    // 3b) si tiró excepción (probable CORS), probamos JSONP
    try {
      const urlJsonp = WEBHOOK_URL + "?" + new URLSearchParams({ payload: payloadStr });
      const data3 = await fetchJsonp(urlJsonp);
      return { ...data3, via: "JSONP" };
    } catch (e2) {
      return { ok: false, reason: String(e2 || e) };
    }
  }
}

const labelsLayer   = L.featureGroup().addTo(map);

    // ===== Divisiones de GRUPO (1..5) =====
    // Dibuja el contorno negro que agrupa los territorios de cada Grupo
    // y el cartel con el número de Grupo, usando el mismo formato que
    // los carteles fijos de territorio (.numero-cartel-fijo).
    function geoJsonAlatLngs(geom) {
      // Convierte coordenadas GeoJSON [lng,lat] a arreglos de LatLng de Leaflet,
      // soportando tanto Polygon como MultiPolygon.
      const ringToLatLngs = ring => ring.map(([lng, lat]) => L.latLng(lat, lng));
      if (geom.type === 'Polygon') {
        return geom.coordinates.map(ringToLatLngs);
      } else if (geom.type === 'MultiPolygon') {
        return geom.coordinates.map(poly => poly.map(ringToLatLngs));
      }
      return [];
    }

    // Un color propio por Grupo (evita el verde/amarillo/rojo del semáforo de registros
    // para no confundirse con ese significado) para que se distingan entre sí de un vistazo.
    const GRUPO_COLORES = {
      1: '#2563eb', // azul
      2: '#db2777', // magenta
      3: '#0d9488', // teal
      4: '#7c3aed', // violeta
      5: '#ea580c'  // naranja
    };
    const COLOR_TERRITORIO = '#64748b'; // gris azulado neutro

    function renderGrupos() {
      gruposLayer.clearLayers();
      const g = window.gruposSalinas;
      if (!g || !g.boundaries) return;

      for (const grupoNum of Object.keys(g.boundaries)) {
        const geom = g.boundaries[grupoNum];
        const latlngs = geoJsonAlatLngs(geom);
        if (!latlngs.length) continue;
        const color = GRUPO_COLORES[grupoNum] || '#000';

        L.polygon(latlngs, {
          color,
          weight: 5,
          opacity: 0.95,
          fill: false,
          interactive: false
        }).addTo(gruposLayer);

        const labelLatLng = g.labels && g.labels[grupoNum];
        if (labelLatLng) {
          const icon = L.divIcon({
            className: 'numero-cartel-fijo',
            html: `<span style="background-color:${color};">${grupoNum}</span>`,
            iconSize: [35, 35],
            iconAnchor: [15, 15]
          });
          L.marker(labelLatLng, { icon, interactive: false, zIndexOffset: 2000 }).addTo(gruposLayer);
        }
      }
    }

    // ===== Contorno de cada TERRITORIO (une las manzanas/polígonos que comparten =====
    // el mismo número de territorio en un solo límite, con su cartel numerado.
    function renderTerritorios() {
      territorioLayer.clearLayers();
      const g = window.gruposSalinas;
      if (!g || !g.territorioBoundaries) return;

      for (const terrNum of Object.keys(g.territorioBoundaries)) {
        const geom = g.territorioBoundaries[terrNum];
        const latlngs = geoJsonAlatLngs(geom);
        if (!latlngs.length) continue;

        L.polygon(latlngs, {
          color: COLOR_TERRITORIO,
          weight: 2.5,
          opacity: 0.9,
          fill: false,
          interactive: false
        }).addTo(territorioLayer);

        const labelLatLng = g.territorioLabels && g.territorioLabels[terrNum];
        if (labelLatLng) {
          const icon = L.divIcon({
            className: 'numero-cartel-territorio',
            html: String(terrNum),
            iconSize: null,
            iconAnchor: [0, 0]
          });
          L.marker(labelLatLng, { icon, interactive: false, zIndexOffset: 1500 }).addTo(territorioLayer);
        }
      }
    }

    function indexarPorTerritorio(arr) {
      const mapa = new Map();
      for (const p of (arr||[])) {
        if (!Array.isArray(p.coords) || !p.coords.length) continue;
        const terrNum = toNumeroTerritorio(p.territorio);
        if (!terrNum) continue;
        if (!mapa.has(terrNum)) mapa.set(terrNum, []);
        mapa.get(terrNum).push(p);
      }
      return mapa;
    }

    function getFillHexFromDatos(id) {
      const key = idKey(id);
      const d = __datosMap.get(key);

      if (d) {
        const claseAHex = {
          gray:'#808080', green:'green', yellow:'#FFD700', red:'#ff0000'
        };
        console.log(id + " : " + d.ultimaFecha);
        const c = obtenerColorPorTiempo(d.ultimaFecha);
        return claseAHex[c] || '#808080';
      }else{
        return '#808080';
      }
    }

  // Umbrales de tiempo (en días) para el semáforo de color
  const DIAS_LIMITE_VERDE    = 60; // menos de 2 meses
  const DIAS_LIMITE_AMARILLO = 90; // hasta 3 meses

  function parsearFecha_(fechaStr) {
    if (!fechaStr) return null;
    // Acepta "YYYY-MM-DD" o cualquier string parseable por Date().
    const s = String(fechaStr).trim();
    const f = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00:00') : new Date(s);
    return isNaN(f.getTime()) ? null : f;
  }

  function obtenerColorPorTiempo(ultimaFechaStr) {
      const fecha = parsearFecha_(ultimaFechaStr);
      if (!fecha) return "gray";       // nunca se registró / fecha inválida

      const hoy = new Date();
      const msPorDia = 1000 * 60 * 60 * 24;
      const diasTranscurridos = Math.floor((hoy - fecha) / msPorDia);

      if (diasTranscurridos < 0) return "green";               // fecha futura (raro), la tratamos como reciente
      if (diasTranscurridos < DIAS_LIMITE_VERDE) return "green";
      if (diasTranscurridos <= DIAS_LIMITE_AMARILLO) return "yellow";
      return "red";
}


function repintarTerritorio(territorio){
  const terrKey = window.idKey ? window.idKey(territorio) : String(territorio ?? '');
  polygonsLayer.eachLayer(layer => {
    // layer carries no terr prop; we reconstruct from closure? Instead read from stored options if attached.
    // We'll attach __terr on creation below; if not, fallback via feature props.
    const t = layer && layer.__terr != null ? layer.__terr : null;
    if (String(t) === String(territorio)) {
      const hex = getFillHexFromDatos(layer.__polyId);
      layer.setStyle({ fillColor: hex });
    }
  });
}


async function init() {
  if (!Array.isArray(window.poligonos) || !window.poligonos.length) {
    alert('poligonos_salinas.js no definió window.poligonos o está vacío'); return;
  }

  // Datos JSON (stats_rt)
  const datos = await cargarDatosDesdeBackend();
  // Normalizamos las claves para asegurar match con p.id
  window.__datosMap = new Map(datos.map(d => [window.idKey ? window.idKey(d.id) : String(d.id), d]));

  // Pintar: SIEMPRE se muestran todos los polígonos a todos los usuarios
  // (filtro por "vista" deshabilitado a pedido)
  polygonsLayer.clearLayers(); labelsLayer.clearLayers(); cartelesLayer.clearLayers(); territorioLayer.clearLayers();
  let bounds = null;

  const listaAll = Array.isArray(window.poligonos) ? window.poligonos : [];
  for (const p of listaAll) {
    const hex = getFillHexFromDatos(p.id);
    const poly = L.polygon(p.coords, { color:'#999', weight:0.6, opacity:0.4, fillColor:hex, fillOpacity:0.5 }).addTo(polygonsLayer);
    poly.__terr = p.territorio;
    poly.__polyId = p.id;
    poly.on('click', () => abrirModalSiLogueado(p.territorio, p.id));
    const labelPt = centroidArea(p.coords) || centroide(p.coords) || poly.getBounds().getCenter();
    const icon = L.divIcon({ className:'numero-cartel', html:String(p.id), iconSize: null, iconAnchor: [0,0] });
    L.marker(labelPt, { icon, interactive:false, zIndexOffset: 1000 }).addTo(labelsLayer);
    if (!bounds) bounds = L.latLngBounds(p.coords); else bounds.extend(p.coords);
  }

  // Se dibujan DESPUÉS de las manzanas para que sus líneas queden por encima
  // (si se dibujan antes, el relleno de las manzanas las tapa).
  renderTerritorios();
  renderGrupos();

  if (bounds && bounds.isValid()) {
    map.fitBounds(bounds, { padding: [10,10], maxZoom: 18 });
    const center = bounds.getCenter();
    map.setView(center, 19, { animate: false });
  } else {
    map.setView(centrado, 19, { animate: false });
  }
}

(function(){
  const btn = document.getElementById('btnGeoToggle');
  if (!btn) return;

  let geoWatchId = null;
  let geoMarker = null;
  let geoAccuracyCircle = null;
  let geoActive = false;
  let centeredOnce = false;

  function onGeoSuccess(pos){
    const { latitude, longitude, accuracy } = pos.coords;
    const latlng = [latitude, longitude];

    if (!geoMarker){
      geoMarker = L.marker(latlng, { title: 'Mi ubicación' }).addTo(map);
    } else {
      geoMarker.setLatLng(latlng);
    }

    if (!geoAccuracyCircle){
      geoAccuracyCircle = L.circle(latlng, {
        radius: accuracy,
        weight: 1,
        color: '#2563eb',
        fillOpacity: 0.1
      }).addTo(map);
    } else {
      geoAccuracyCircle.setLatLng(latlng);
      geoAccuracyCircle.setRadius(accuracy);
    }

    if (!centeredOnce){
      map.setView(latlng, Math.max(map.getZoom(), 18));
      centeredOnce = true;
    }
  }

  function onGeoError(err){
    (window.showToast || console.log)('No se pudo obtener tu ubicación: ' + err.message);
    stopGeo();
  }

  function startGeo(){
    if (!('geolocation' in navigator)){
      (window.showToast || console.log)('Geolocalización no soportada en este navegador');
      return;
    }
    if (geoWatchId != null) return;
    centeredOnce = false;
    geoWatchId = navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, {
      enableHighAccuracy: true,
      maximumAge: 5000,
      timeout: 10000
    });
    geoActive = true;
    btn.setAttribute('aria-pressed', 'true');
    btn.classList.add('active');
    btn.textContent = '📍 Ubicación (ON)';
    (window.showToast || console.log)('Ubicación en tiempo real activada');
  }

  function stopGeo(){
    if (geoWatchId != null){
      navigator.geolocation.clearWatch(geoWatchId);
      geoWatchId = null;
    }
    if (geoMarker){ map.removeLayer(geoMarker); geoMarker = null; }
    if (geoAccuracyCircle){ map.removeLayer(geoAccuracyCircle); geoAccuracyCircle = null; }
    geoActive = false;
    btn.setAttribute('aria-pressed', 'false');
    btn.classList.remove('active');
    btn.textContent = '📍 Mi ubicación';
    (window.showToast || console.log)('Ubicación en tiempo real desactivada');
  }

  btn.addEventListener('click', () => {
    if (geoActive) stopGeo(); else startGeo();
  });

  window.addEventListener('beforeunload', stopGeo);
})();

<!-- ===== LOGIN MODAL (idéntico a index.slim2.html en estructura/IDs) ===== -->
<div id="login-overlay" class="overlay">
  <div id="login-modal" class="modal-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <header class="modal-header">
      <h3 id="login-title" class="modal-title">Iniciar sesión</h3>
      <button id="login-close" class="modal-close-btn" title="Cerrar">✕</button>
    </header>
    <div class="modal-body">
      <div class="form-field">
        <label for="inUser" class="form-label">Usuario</label>
        <input id="inUser" class="form-input" autocomplete="username" />
      </div>
      <div class="form-field">
        <label for="inPass" class="form-label">Contraseña</label>
        <input id="inPass" class="form-input" type="password" autocomplete="current-password" />
      </div>
      <div class="form-actions">
        <button id="login-cancel" class="btn-cancel" type="button">Cancelar</button>
        <button id="btnLogin" class="btn-primary" type="button">Ingresar</button>
      </div>
    </div>
  </div>
</div>


<script>
// ===== Toast fallback (si no existe) =====
window.showToast = window.showToast || function(msg){
  if (!msg) return;
  try { console.log("[toast]", msg); } catch(_){}
};

// ====== DOM refs ======
const btnAuthOpen    = document.getElementById('btnAuthOpen');
const btnLogout      = document.getElementById('btnLogout');
const overlayLogin   = document.getElementById('login-overlay');
const btnLogin       = document.getElementById('btnLogin');
const inUser         = document.getElementById('inUser');
const inPass         = document.getElementById('inPass');
const btnCloseLogin  = document.getElementById('login-close');
const btnCancelLogin = document.getElementById('login-cancel');

function openLogin(){
  overlayLogin.style.display='flex';
  inUser && inUser.focus();
}
function closeLogin(){
  overlayLogin.style.display='none';
}

btnAuthOpen && btnAuthOpen.addEventListener('click', openLogin);
btnCloseLogin && btnCloseLogin.addEventListener('click', closeLogin);
btnCancelLogin && btnCancelLogin.addEventListener('click', closeLogin);

btnLogin && btnLogin.addEventListener('click', () => {
  const u = (inUser.value||'').trim();
  const p = (inPass.value||'').trim();
  if (!u || !p){
    window.showToast && window.showToast('Ingresá usuario y contraseña');
    return;
  }
  if (window.AuthApp && typeof window.AuthApp.doLogin === "function"){
    window.AuthApp.doLogin(u,p);
  } else {
    window.showToast && window.showToast('AuthApp no está disponible');
  }
  closeLogin();
});

btnLogout && btnLogout.addEventListener('click', () => {
  if (window.AuthApp && typeof window.AuthApp.logout === "function"){
    window.AuthApp.logout();
  }
});

// Restaurar sesión al cargar
document.addEventListener('DOMContentLoaded', () => {
  if (window.AuthApp && typeof window.AuthApp.restore === "function"){
    window.AuthApp.restore();
  }
});
</script>

<script>
// === Gate de registro: sólo mostrar modal si hay sesión ===
function __isLogged(){
  try{
    return !!(window.AuthApp && typeof AuthApp.isLogged === "function" && AuthApp.isLogged());
  }catch(_){ return false; }
}
function __openLoginIfNeeded(){
  try{
    const overlay = document.getElementById('login-overlay');
    if (overlay){ overlay.style.display = 'flex'; }
  }catch(_){}
}
function abrirModalSiLogueado(terr, polyId){
  if (!__isLogged()){
    (window.showToast||console.log)("Necesitás iniciar sesión para registrar territorios");
    __openLoginIfNeeded();
    return;
  }
  if (typeof abrirModal === "function"){
    abrirModal(terr, polyId);
  }
}
</script>


<script>
(function(){
  function setupReferenciasToggle(){
    var btn = document.getElementById('btnReferencias');
    var panel = document.getElementById('referencias');
    if (!btn || !panel) return;

    var mq = window.matchMedia('(max-width: 768px)');

    function collapse(){
      panel.style.overflow = 'hidden';
      panel.style.maxHeight = '0px';
      panel.style.opacity = '0';
      panel.dataset.collapsed = 'true';
      btn.setAttribute('aria-expanded','false');
    }
    function expand(){
      panel.style.overflow = 'hidden';
      panel.style.display = 'block';
      // Medimos el contenido y aplicamos altura
      var h = panel.scrollHeight;
      panel.style.maxHeight = h + 'px';
      panel.style.opacity = '1';
      panel.dataset.collapsed = 'false';
      btn.setAttribute('aria-expanded','true');
    }
    function resetDesktop(){
      panel.style.removeProperty('overflow');
      panel.style.removeProperty('max-height');
      panel.style.removeProperty('opacity');
      delete panel.dataset.collapsed;
      btn.setAttribute('aria-expanded','true');
    }
    function applyByViewport(){
      if (mq.matches){
        collapse();
        btn.style.display = 'inline-flex';
      } else {
        resetDesktop();
        btn.style.display = 'none';
      }
    }
    applyByViewport();
    mq.addEventListener('change', applyByViewport);

    btn.addEventListener('click', function(){
      if (panel.dataset.collapsed === 'true'){
        expand();
      } else {
        collapse();
      }
    });

    // Mantener altura correcta si cambia el viewport o el contenido
    window.addEventListener('resize', function(){
      if (panel.dataset.collapsed === 'false'){
        panel.style.maxHeight = panel.scrollHeight + 'px';
      }
    });
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', setupReferenciasToggle);
  } else {
    setupReferenciasToggle();
  }
})();
</script>
